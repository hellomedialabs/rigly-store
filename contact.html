<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Rigly</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Rig<span>ly</span></a><nav><a href="index.html#shop">Shop</a></nav></div></header>
<main class="wrap doc">
<h1>Contact</h1>
<p>Questions about an order, shipping or a product? Send us a message with your order number and we will reply within 2 business days.</p>
<form id="contact-form" method="POST">
  <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
  <p><label>Name<br><input name="name" required style="width:100%;padding:10px"></label></p>
  <p><label>Your email<br><input name="email" type="email" required style="width:100%;padding:10px"></label></p>
  <p><label>Order number (if any)<br><input name="order" style="width:100%;padding:10px"></label></p>
  <p><label>Message<br><textarea name="message" rows="5" required style="width:100%;padding:10px"></textarea></label></p>
  <button class="btn" type="submit" style="border:0;cursor:pointer">Send message</button>
</form>
<p id="form-status" role="status"></p>
</main>
<footer><div class="wrap"><a href="index.html">Home</a><a href="shipping.html">Shipping</a><a href="returns.html">Returns</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></footer>
<script src="site.js"></script></body></html>
